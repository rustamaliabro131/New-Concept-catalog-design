<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <!-- Hanger Wood Gradient -->
    <linearGradient id="hangerWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2516" />
      <stop offset="50%" stop-color="#674227" />
      <stop offset="100%" stop-color="#2C190D" />
    </linearGradient>
    <!-- Brass Hook Gradient -->
    <linearGradient id="brassHook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE6B9" />
      <stop offset="45%" stop-color="#C5A880" />
      <stop offset="85%" stop-color="#8E6A3B" />
      <stop offset="100%" stop-color="#5C411D" />
    </linearGradient>
    <!-- Fabric Shading Gradient -->
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1828" />
      <stop offset="25%" stop-color="#4D2237" />
      <stop offset="50%" stop-color="#3A1828" />
      <stop offset="75%" stop-color="#4D2237" />
      <stop offset="100%" stop-color="#3A1828" />
    </linearGradient>
    <!-- Gold / Tilla Embroidery Gradient -->
    <linearGradient id="tillaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECD49F" />
      <stop offset="50%" stop-color="#C8A261" />
      <stop offset="100%" stop-color="#694C1B" />
    </linearGradient>
    <!-- Soft Ambient Cast Filter -->
    <filter id="ambientSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="rgba(30,25,20,0.25)" />
    </filter>
  </defs>

  <!-- HANGER ASSEMBLY (Anchored to Closet Rail) -->
  <g class="hanger-structure">
    <!-- Brass Swivel Hook -->
    <path d="M 200 50 C 188 50, 180 38, 186 24 C 192 10, 214 10, 214 26 C 214 42, 202 52, 200 66" 
          fill="none" stroke="url(#brassHook)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="200" cy="67" r="3.5" fill="url(#brassHook)" />
    <!-- Wooden Contoured Shoulders -->
    <path d="M 85 100 Q 200 78 315 100 Q 324 108 318 114 Q 200 94 82 114 Q 76 108 85 100 Z" 
          fill="url(#hangerWood)" filter="url(#ambientSoft)" />
    <!-- Center Brass Mount Collar -->
    <rect x="194" y="70" width="12" height="7" rx="2" fill="url(#brassHook)" />
  </g>

  <!-- GARMENT SILHOUETTE & LUXURY DETAILING -->
  <g class="garment-render" filter="url(#ambientSoft)">
    <!-- Main Body Cut -->
    <path d="M 120 102 
             L 65 235 
             L 100 248 
             L 135 180 
             L 100 525 
             Q 200 545 300 525 
             L 265 180 
             L 300 248 
             L 335 235 
             L 280 102 
             Q 200 115 120 102 Z" 
          fill="url(#fabricGrad)" />

    <!-- Drape Folds and Pleats -->
    <path d="M 155 180 Q 148 350 145 525" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="3" />
    <path d="M 245 180 Q 252 350 255 525" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="3" />
    <path d="M 200 230 L 200 535" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

    <!-- Neckline Yoke & Embroidered Patti -->
    <path d="M 160 106 Q 200 152 240 106 Q 200 118 160 106 Z" fill="url(#tillaGold)" />
    <path d="M 197 128 L 203 128 L 202 260 L 198 260 Z" fill="url(#tillaGold)" />

    <!-- Hand-Embroidered Zardozi & Resham Pearls -->
    <circle cx="200" cy="155" r="3.5" fill="#ECD49F" />
    <circle cx="200" cy="180" r="3.5" fill="#ECD49F" />
    <circle cx="200" cy="205" r="3.5" fill="#ECD49F" />
    <circle cx="200" cy="230" r="3.5" fill="#ECD49F" />
    <circle cx="200" cy="255" r="3.5" fill="#ECD49F" />

    <!-- Paisley Floral Neckline Flourishes -->
    <path d="M 180 148 Q 200 162 220 148" fill="none" stroke="url(#tillaGold)" stroke-width="2.2" />
    <path d="M 175 174 Q 200 190 225 174" fill="none" stroke="url(#tillaGold)" stroke-width="2" />
    <path d="M 180 200 Q 200 214 220 200" fill="none" stroke="url(#tillaGold)" stroke-width="1.8" />

    <!-- Sleeve Cuffs & Borders -->
    <path d="M 65 235 L 100 248" stroke="url(#tillaGold)" stroke-width="6" stroke-linecap="round" />
    <path d="M 335 235 L 300 248" stroke="url(#tillaGold)" stroke-width="6" stroke-linecap="round" />

    <!-- Hem Border: Organza Insert & Scalloped Embroidery -->
    <path d="M 100 508 Q 200 528 300 508" fill="none" stroke="url(#tillaGold)" stroke-width="5" />
    <path d="M 106 520 Q 200 540 294 520" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="14" stroke-linecap="round" />
    <path d="M 100 526 Q 200 546 300 526" fill="none" stroke="#2E111E" stroke-width="4" />

    <!-- Delicate Booti Spray across Skirt / Flare -->
    <g fill="#ECD49F" opacity="0.85">
      <circle cx="165" cy="330" r="2.2" />
      <circle cx="235" cy="330" r="2.2" />
      <circle cx="145" cy="415" r="2.5" />
      <circle cx="255" cy="415" r="2.5" />
      <circle cx="200" cy="375" r="2.5" />
      <circle cx="175" cy="460" r="2.2" />
      <circle cx="225" cy="460" r="2.2" />
      <circle cx="130" cy="475" r="2.0" />
      <circle cx="270" cy="475" r="2.0" />
    </g>
  </g>
</svg>